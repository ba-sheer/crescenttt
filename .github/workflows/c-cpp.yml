name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make libncurses-dev libcurl4-openssl-dev

      - name: Build
        run: make

      - name: Check binary
        run: |
          file crescent-tui
          test -x crescent-tui
